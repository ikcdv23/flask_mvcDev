{% extends "base.html" %}
{% block content %}
<h2>Nuevo Socio</h2>
<form method="POST">
    {{ form.hidden_tag() }}
    <div class="mb-3">
        {{ form.nombre.label }} {{ form.nombre(class="form-control") }}
    </div>
    <div class="mb-3">
        {{ form.email.label }} {{ form.email(class="form-control") }}
    </div>
    {{ form.submit(class="btn btn-success") }}
</form>
{% endblock %}
