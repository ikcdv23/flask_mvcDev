<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<title>{% block title %}Mi aplicación{% endblock %}</title>
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='css/estilos.css') }}"
		/>
	</head>
	<body>
		<header>
			<nav>
				<a href="{{ url_for('navigation.inicio') }}">Inicio</a>
				<a href="{{ url_for('libros.listar') }}">Libros</a>
				<a href="{{ url_for('libros.grid') }}">Libros Grid</a>
				<a href="{{ url_for('socios.listar') }}">Socios</a>
				<div>
					{% if current_user.is_authenticated %}
					<a href="{{ url_for('auth.logout') }}" class="btn btn-danger">
						<i class="fas fa-sign-out-alt"></i> Cerrar Sesión ({{
						current_user.username }})
					</a>

					{% else %}
					<a href="{{ url_for('auth.login') }}" class="btn btn-primary">
						<i class="fas fa-user"></i> Iniciar Sesión
					</a>

					{% endif %}
				</div>
			</nav>
		</header>

		<main>{% block content %} {% endblock %}</main>
		<footer>
			<p>&copy; 2025 Mi aplicación</p>
		</footer>
	</body>
</html>
